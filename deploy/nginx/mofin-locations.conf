# Shared proxy locations for Mofin (included from HTTP and HTTPS server blocks)

location = /mofin {
    return 301 /mofin/;
}

# Nitro serves hashed assets at /assets, while the app HTML/JS request /mofin/assets
location ^~ /mofin/assets/ {
    proxy_pass http://mofin_web/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~ ^/mofin/(favicon\.ico|manifest\.json|robots\.txt)$ {
    rewrite ^/mofin/(.*)$ /$1 break;
    proxy_pass http://mofin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /mofin/ {
    proxy_pass http://mofin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
}

location = /mofin-api {
    return 301 /mofin-api/;
}

location /mofin-api/ {
    proxy_pass http://mofin_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
